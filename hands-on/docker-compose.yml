services:
  mysql:
    image: mariadb:10.11
    hostname: mysql
    container_name: ct_mysql
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: slurm_acct_db
      MYSQL_USER: slurm
      MYSQL_PASSWORD: password
    volumes:
      - ct_var_lib_mysql:/var_lib/mysql
    networks:
      - ct_slurm-network

  slurmdbd:
    image: slurm-docker-cluster:${IMAGE_TAG}
    build:
      context: .
      args:
        SLURM_TAG: ${SLURM_TAG}
    command: ["slurmdbd"]
    container_name: ct_slurmdbd
    hostname: slurmdbd
    volumes:
      - ct_etc_munge:/etc/munge
      - ct_etc_slurm:/etc/slurm
      - ct_var_log_slurmdbd:/var/log/slurm
      - ./qrmi_config.json:/etc/slurm/qrmi_config.json
      - ./plugstack.conf:/etc/slurm/plugstack.conf
    expose:
      - "6819"
    depends_on:
      - mysql
    networks:
      - ct_slurm-network

  slurmctld:
    image: slurm-docker-cluster:${IMAGE_TAG}
    build:
      context: .
      args:
        SLURM_TAG: ${SLURM_TAG}
    command: ["slurmctld"]
    container_name: ct_slurmctld
    hostname: slurmctld
    volumes:
      - ct_etc_munge:/etc/munge
      - ct_etc_slurm:/etc/slurm
      - ct_var_log_slurmctld:/var/log/slurm
      - ./cgroup.conf:/etc/slurm/cgroup.conf
      - ./qrmi_config.json:/etc/slurm/qrmi_config.json
      - ./plugstack.conf:/etc/slurm/plugstack.conf
    expose:
      - "6817"
    depends_on:
      - "slurmdbd"
    networks:
      - ct_slurm-network

  c1:
    image: slurm-docker-cluster:${IMAGE_TAG}
    build:
      context: .
      args:
        SLURM_TAG: ${SLURM_TAG}
    command: ["slurmd"]
    hostname: c1
    container_name: ct_c1
    volumes:
      - ct_etc_munge:/etc/munge
      - ct_etc_slurm:/etc/slurm
      - ct_var_log_c1:/var/log/slurm
      - ct_homedir:/home/slurmuser
      - ./scripts:/home/slurmuser/scripts
      - ./cgroup.conf:/etc/slurm/cgroup.conf
      - ./qrmi_config.json:/etc/slurm/qrmi_config.json
      - ./plugstack.conf:/etc/slurm/plugstack.conf
    expose:
      - "6818"
    depends_on:
      - "slurmctld"
    networks:
      - ct_slurm-network

  c2:
    image: slurm-docker-cluster:${IMAGE_TAG}
    build:
      context: .
      args:
        SLURM_TAG: ${SLURM_TAG}
    command: ["slurmd"]
    hostname: c2
    container_name: ct_c2
    volumes:
      - ct_etc_munge:/etc/munge
      - ct_etc_slurm:/etc/slurm
      - ct_var_log_c2:/var/log/slurm
      - ct_homedir:/home/slurmuser
      - ./scripts:/home/slurmuser/scripts
      - ./cgroup.conf:/etc/slurm/cgroup.conf
      - ./qrmi_config.json:/etc/slurm/qrmi_config.json
      - ./plugstack.conf:/etc/slurm/plugstack.conf
    expose:
      - "6818"
    depends_on:
      - "slurmctld"
    networks:
      - ct_slurm-network

  slurm-login:
    image: slurm-docker-cluster:${IMAGE_TAG}
    build:
      context: .
      args:
        SLURM_TAG: ${SLURM_TAG}
    command: ["login"]
    hostname: login
    container_name: ct_login
    stdin_open: true
    tty: true
    volumes:
      - ct_etc_munge:/etc/munge
      - ct_etc_slurm:/etc/slurm
      - ct_homedir:/home/slurmuser
      - ./scripts:/home/slurmuser/scripts
      - ./qrmi_config.json:/etc/slurm/qrmi_config.json
      - ./plugstack.conf:/etc/slurm/plugstack.conf
    expose:
      - "6818"
    depends_on:
      - "slurmctld"
    networks:
      - ct_slurm-network

volumes:
  ct_etc_munge:
  ct_etc_slurm:
  ct_var_lib_mysql:
  ct_var_log_slurmdbd:
  ct_var_log_slurmctld:
  ct_var_log_c1:
  ct_var_log_c2:
  ct_homedir:

networks:
  ct_slurm-network:
    driver: bridge
